<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>النسخ الاحتياطي | ياسمين الشام</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-page{max-width:850px;margin:30px auto;padding:20px}
    .panel{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin-top:20px}
    .backup-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #e2e8f0;flex-wrap:wrap}
    .backup-row:last-child{border-bottom:0}
    #backupMessage{margin-top:15px}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/admin.html">
      <span class="brand-mark">Y</span>
      <span><strong>ياسمين الشام</strong><small>النسخ الاحتياطي</small></span>
    </a>
    <a class="btn btn-light" href="/admin.html">لوحة الإدارة</a>
  </header>

  <main class="admin-page">
    <h1>النسخ الاحتياطي</h1>

    <section class="panel">
      <h2>إنشاء نسخة جديدة</h2>
      <p>إنشاء نسخة احتياطية من قاعدة بيانات المنصة.</p>
      <button class="btn btn-primary" id="createBackup" type="button">
        إنشاء نسخة احتياطية
      </button>
      <p id="backupMessage" role="status"></p>
    </section>

    <section class="panel">
      <h2>النسخ المتوفرة</h2>
      <button class="btn btn-light" id="refreshBackups" type="button">
        تحديث القائمة
      </button>
      <div id="backupList" aria-live="polite">
        جارٍ تحميل النسخ...
      </div>
    </section>
  </main>

  <script src="/js/admin-backups.js"></script>
<footer style="text-align:center;padding:22px;margin-top:30px;border-top:1px solid #e5e7eb">

  <span style="margin:0 12px">|</span>

<span style="margin:0 12px">|</span><a href="/contact.html">تواصل معنا</a>
</footer>
<script src="/js/accessibility-controls.js"></script>
<script src="/js/network-status.js"></script>
<script src="/js/back-to-top.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقرير المهام | ياسمين الشام</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.report{max-width:1150px;margin:30px auto;padding:20px}
.report-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}
.report-tools input{padding:12px;border:1px solid #dce3ed;border-radius:9px}
.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px;margin:20px 0}
.report-card{background:white;border:1px solid #e2e8f0;border-radius:13px;padding:18px}
.report-card small{color:#718096}
.report-card h2{color:#173e70;margin-top:10px}
.report-table{overflow-x:auto;background:white;border:1px solid #e2e8f0;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{text-align:right;padding:13px;border-bottom:1px solid #e8edf3}
th{background:#f5f7fa;color:#173e70}
#reportMessage{margin:15px 0;color:#64748b}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="/admin.html"><span class="brand-mark">Y</span><span><strong>ياسمين الشام</strong><small>لوحة الإدارة</small></span></a>
<a class="btn btn-light" href="/admin.html">العودة للإدارة</a>
</header>
<main class="report">
<h1>تقرير المهام اليومية</h1>
<p>ملخص إنجاز المهام والمكافآت حسب التاريخ.</p>
<div class="report-tools">
<label>تاريخ التقرير: <input type="date" id="reportDate"></label>
<button id="loadReport" class="btn btn-primary">عرض التقرير</button>
<button id="exportTaskReport" class="btn btn-light" type="button">????? ??? Excel</button>
<button id="printReport" class="btn btn-light">طباعة التقرير</button>
</div>
<section class="report-grid">
<article class="report-card"><small>إجمالي المهام</small><h2 id="totalTasks">0</h2></article>
<article class="report-card"><small>المكافآت المعلقة</small><h2 id="pendingTasks">0</h2><p id="pendingAmount">$0.00</p></article>
<article class="report-card"><small>المكافآت الممولة</small><h2 id="fundedTasks">0</h2><p id="fundedAmount">$0.00</p></article>
</section>
<p id="reportMessage" role="status">جاري تحميل التقرير...</p>
<div class="report-table">
<table>
<thead><tr><th>رقم المهمة</th><th>رقم العضو</th><th>الفترة</th><th>المكافأة</th><th>الحالة</th><th>تاريخ التسجيل</th></tr></thead>
<tbody id="reportRows"></tbody>
</table>
</div>
</main>
<script src="/js/admin-task-report.js"></script>
<script src="/js/accessibility-controls.js"></script>
<script src="/js/network-status.js"></script>
<script src="/js/back-to-top.js"></script>
</body>
</html>

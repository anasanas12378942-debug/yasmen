<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة الأعضاء | ياسمين الشام</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-page{max-width:1100px;margin:30px auto;padding:20px}
    .panel{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin-top:20px}
    .search-box{display:flex;gap:10px;flex-wrap:wrap}
    .search-box input{flex:1;min-width:180px;padding:12px;border:1px solid #d5dce5;border-radius:8px}
    .table-wrap{overflow-x:auto;margin-top:20px}
    table{width:100%;min-width:650px;border-collapse:collapse}
    th,td{text-align:right;padding:13px;border-bottom:1px solid #e5e7eb}
    th{background:#f5f8fc}
    .status-select{padding:8px;border:1px solid #d5dce5;border-radius:7px}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/admin.html">
      <span class="brand-mark">Y</span>
      <span><strong>ياسمين الشام</strong><small>إدارة الأعضاء</small></span>
    </a>
    <a class="btn btn-light" href="/admin.html">لوحة الإدارة</a>
  </header>

  <main class="admin-page">
    <h1>إدارة الأعضاء</h1>
    <section class="panel">
      <form id="searchForm" class="search-box">
        <input id="searchInput" placeholder="ابحث بالاسم أو الهاتف أو البريد">
        <button class="btn btn-primary" type="submit">بحث</button>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>العضو</th>
              <th>وسيلة التواصل</th>
              <th>الحالة</th>
              <th>تاريخ التسجيل</th>
              <th>تعديل الحالة</th>
            </tr>
          </thead>
          <tbody id="usersRows">
            <tr><td colspan="5">جارٍ تحميل الأعضاء...</td></tr>
          </tbody>
        </table>
      </div>
      <p id="usersMessage" role="status"></p>
    </section>
  </main>

  <script src="/js/admin-users.js"></script>
<footer style="text-align:center;padding:22px;margin-top:30px;border-top:1px solid #e5e7eb">
  <a href="/terms.html">الشروط والأحكام</a>
  <span style="margin:0 12px">|</span>
  <a href="/privacy.html">سياسة الخصوصية</a>
  <p style="font-size:13px;color:#758398">© ياسمين الشام</p>
<span style="margin:0 12px">|</span><a href="/faq.html">الأسئلة الشائعة</a>
<span style="margin:0 12px">|</span><a href="/about.html">من نحن</a>
<span style="margin:0 12px">|</span><a href="/contact.html">تواصل معنا</a>
</footer>
<script src="/js/accessibility-controls.js"></script>
<script src="/js/network-status.js"></script>
<script src="/js/back-to-top.js"></script>
</body>
</html>

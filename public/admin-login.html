<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول الإدارة | ياسمين الشام</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-login{max-width:430px;margin:70px auto;padding:25px;background:white;border:1px solid #e2e8f0;border-radius:16px}
    .admin-login label{display:block;margin:16px 0 7px}
    .admin-login input{width:100%;padding:13px;border:1px solid #d5dce5;border-radius:8px}
    .admin-login button{width:100%;margin-top:20px}
    .admin-note{color:#64748b;font-size:13px;margin-top:15px}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">Y</span>
      <span><strong>ياسمين الشام</strong><small>إدارة المنصة</small></span>
    </a>
  </header>

  <main class="admin-login">
    <h1>دخول الإدارة</h1>
    <p>هذه الصفحة مخصصة لحسابات الإدارة فقط.</p>

    <form id="adminLoginForm">
      <label for="contact">الهاتف أو البريد الإلكتروني</label>
      <input id="contact" autocomplete="username" required>

      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button class="btn btn-primary" type="submit">دخول الإدارة</button>
    </form>

    <p id="adminLoginMessage" role="status"></p>
    <p class="admin-note">لا يمكن إنشاء صلاحيات إدارية من هذه الصفحة.</p>
  </main>

  <script src="/js/admin-login.js"></script>
<footer style="text-align:center;padding:22px;margin-top:30px;border-top:1px solid #e5e7eb">
  <a href="/terms.html">الشروط والأحكام</a>
  <span style="margin:0 12px">|</span>
  <a href="/privacy.html">سياسة الخصوصية</a>
  <p style="font-size:13px;color:#758398">© ياسمين الشام</p>
<span style="margin:0 12px">|</span><a href="/faq.html">الأسئلة الشائعة</a>
<span style="margin:0 12px">|</span><a href="/about.html">من نحن</a>
<span style="margin:0 12px">|</span><a href="/contact.html">تواصل معنا</a>
</footer>
<script src="/js/password-visibility.js"></script>
<script src="/js/accessibility-controls.js"></script>
<script src="/js/network-status.js"></script>
<script src="/js/back-to-top.js"></script>
</body>
</html>

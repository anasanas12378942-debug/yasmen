<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة الدعم | ياسمين الشام</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-page{max-width:950px;margin:30px auto;padding:20px}
    .panel{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin-top:20px}
    .ticket{padding:16px 0;border-bottom:1px solid #e2e8f0}
    .ticket:last-child{border-bottom:0}
    .ticket small{display:block;color:#64748b;margin:7px 0}
    .ticket textarea{width:100%;min-height:90px;padding:12px;border:1px solid #d5dce5;border-radius:8px}
    .ticket button{margin-top:10px}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/admin.html">
      <span class="brand-mark">Y</span>
      <span><strong>ياسمين الشام</strong><small>إدارة الدعم</small></span>
    </a>
    <a class="btn btn-light" href="/admin.html">لوحة الإدارة</a>
  </header>

  <main class="admin-page">
    <h1>طلبات الدعم والشكاوى</h1>

    <section class="panel">
      <button class="btn btn-light" id="refreshTickets" type="button">
        تحديث الطلبات
      </button>
      <p id="supportMessage" role="status"></p>
      <div id="ticketList" aria-live="polite">
        جارٍ تحميل الطلبات...
      </div>
    </section>
  </main>

  <script src="/js/admin-support.js"></script>
<footer style="text-align:center;padding:22px;margin-top:30px;border-top:1px solid #e5e7eb">
  <a href="/terms.html">الشروط والأحكام</a>
  <span style="margin:0 12px">|</span>

<span style="margin:0 12px">|</span><a href="/contact.html">تواصل معنا</a>
</footer>
<script src="/js/accessibility-controls.js"></script>
<script src="/js/network-status.js"></script>
<script src="/js/back-to-top.js"></script>
</body>
</html>

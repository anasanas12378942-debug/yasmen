<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مركز المساعدة | ياسمين الشام</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .support-page{max-width:850px;margin:30px auto;padding:20px}
    .support-card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin-top:20px}
    .support-card label{display:block;margin:14px 0 7px}
    .support-card input,.support-card select,.support-card textarea{width:100%;padding:12px;border:1px solid #d5dce5;border-radius:8px}
    .support-card textarea{min-height:120px;resize:vertical}
    .ticket{padding:14px;border-bottom:1px solid #e5e7eb}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/dashboard.html">
      <span class="brand-mark">Y</span>
      <span><strong>ياسمين الشام</strong><small>YASMIN AL-SHAM</small></span>
    </a>
    <a class="btn btn-light" href="/dashboard.html">العودة للوحة العضو</a>
  </header>

  <main class="support-page">
    <h1>مركز المساعدة والدعم</h1>
    <p>أرسل استفسارك أو مشكلتك إلى فريق الإدارة.</p>

    <section class="support-card">
      <h2>إرسال طلب جديد</h2>
      <form id="supportForm">
        <label for="subject">عنوان الطلب</label>
        <input id="subject" maxlength="150" required>

        <label for="category">نوع الطلب</label>
        <select id="category">
          <option value="account">مشكلة في الحساب</option>
          <option value="deposit">الإيداعات</option>
          <option value="withdrawal">السحوبات</option>
          <option value="technical">مشكلة تقنية</option>
          <option value="other">استفسار آخر</option>
        </select>

        <label for="description">تفاصيل الطلب</label>
        <textarea id="description" maxlength="3000" required></textarea>

        <button class="btn btn-primary" type="submit" style="margin-top:15px">إرسال الطلب</button>
      </form>
      <p id="supportMessage" role="status"></p>
    </section>

    <section class="support-card">
      <h2>طلباتي السابقة</h2>
      <div id="tickets">جارٍ تحميل الطلبات...</div>
    </section>
  </main>

  <script src="/js/support.js"></script>
<footer style="text-align:center;padding:22px;margin-top:30px;border-top:1px solid #e5e7eb">
  <a href="/terms.html">الشروط والأحكام</a>
  <span style="margin:0 12px">|</span>
  <a href="/privacy.html">سياسة الخصوصية</a>
  <p style="font-size:13px;color:#758398">© ياسمين الشام</p>
<span style="margin:0 12px">|</span><a href="/faq.html">الأسئلة الشائعة</a>
<span style="margin:0 12px">|</span><a href="/about.html">من نحن</a>
<span style="margin:0 12px">|</span><a href="/contact.html">تواصل معنا</a>
</footer>
<script src="/js/accessibility-controls.js"></script>
<script src="/js/network-status.js"></script>
<script src="/js/back-to-top.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إنشاء حساب | ياسمين الشام</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-wrap{max-width:540px;margin:55px auto;padding:0 18px}
    .auth-card{background:white;border:1px solid var(--border);border-radius:18px;padding:32px;box-shadow:0 12px 35px #173b7010}
    .auth-card h1{color:var(--navy);margin-bottom:8px}
    .auth-card>p{color:var(--muted);margin-bottom:25px}
    .field{margin-bottom:17px}
    .field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
    .field input,.field select{width:100%;padding:13px;border:1px solid var(--border);border-radius:9px;font-size:15px;outline:none;background:#fff}
    .field input:focus,.field select:focus{border-color:var(--blue)}
    .auth-submit{width:100%;border:0;margin-top:10px}
    .auth-links{text-align:center;margin-top:20px;color:var(--muted);font-size:14px}
    .auth-links a{color:var(--blue);font-weight:700}
    .captcha-box{padding:15px;background:#f2f6fb;border-radius:10px;margin-bottom:17px}
    .captcha-box label{display:block;font-weight:700;margin-bottom:8px}
    .captcha-box input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px}
    .form-message{margin-top:15px;font-size:14px}
    @media(max-width:520px){.auth-card{padding:23px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">Y</span>
      <span><strong>ياسمين الشام</strong><small>YASMIN AL-SHAM</small></span>
    </a>
    <a href="/" class="btn btn-light">الرئيسية</a>
  </header>

  <main class="auth-wrap">
    <section class="auth-card">
      <h1>إنشاء حساب جديد</h1>
      <p>أدخل بياناتك لإنشاء حسابك في منصة ياسمين الشام.</p>

      <form id="registerForm">
        <div class="field">
          <label for="method">طريقة التسجيل</label>
          <select id="method" name="method">
            <option value="phone">رقم الهاتف</option>
            <option value="email">البريد الإلكتروني</option>
          </select>
        </div>

        <div class="field">
          <label id="contactLabel" for="contact">رقم الهاتف</label>
          <input id="contact" name="contact" required autocomplete="username">
        </div>

        <div class="field">
          <label for="identityNumber">رقم الهوية الشخصية</label>
          <input id="identityNumber" name="identityNumber" required autocomplete="off">
        </div>

        <div class="field">
          <label for="inviteCode">رمز الدعوة</label>
          <input id="inviteCode" name="inviteCode" autocomplete="off">
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <input id="password" name="password" type="password" minlength="12" required autocomplete="new-password">
        </div>

        <div class="field">
          <label for="confirmPassword">تأكيد كلمة المرور</label>
          <input id="confirmPassword" name="confirmPassword" type="password" minlength="12" required autocomplete="new-password">
        </div>

        <div class="field" style="margin-top:18px">
          <label style="display:flex;align-items:flex-start;gap:10px;font-weight:500">
            <input type="checkbox" id="acceptTerms" required style="width:auto;margin-top:4px">
            <span>أوافق على <a href="/terms.html" target="_blank">الشروط والأحكام</a>.</span>
          </label>
        </div>
        <div class="field">
          <label style="display:flex;align-items:flex-start;gap:10px;font-weight:500">
            <input type="checkbox" id="acceptPrivacy" required style="width:auto;margin-top:4px">
            <span>أوافق على <a href="/privacy.html" target="_blank">سياسة الخصوصية</a>.</span>
          </label>
        </div>
        <div class="captcha-box">
          <label id="captchaQuestion" for="captchaAnswer">سؤال التحقق</label>
          <input id="captchaAnswer" name="captchaAnswer" type="number" required>
        </div>

        <button type="submit" class="btn btn-primary auth-submit">إنشاء الحساب</button>
        <div id="formMessage" class="form-message" role="status"></div>
      </form>

      <div class="auth-links">
        لديك حساب بالفعل؟ <a href="/login.html">تسجيل الدخول</a>
      </div>
    </section>
  </main>

  <script src="/js/register.js"></script>
<footer style="text-align:center;padding:22px;margin-top:30px;border-top:1px solid #e5e7eb">
  <a href="/terms.html">الشروط والأحكام</a>
  <span style="margin:0 12px">|</span>
  <a href="/privacy.html">سياسة الخصوصية</a>
  <p style="font-size:13px;color:#758398">© ياسمين الشام</p>
<span style="margin:0 12px">|</span><a href="/faq.html">الأسئلة الشائعة</a>
<span style="margin:0 12px">|</span><a href="/about.html">من نحن</a>
<span style="margin:0 12px">|</span><a href="/contact.html">تواصل معنا</a>
</footer>
<script src="/js/password-visibility.js"></script>
<script src="/js/accessibility-controls.js"></script>
<script src="/js/password-strength.js"></script>
<script src="/js/password-match.js"></script>
<script src="/js/network-status.js"></script>
<script src="/js/back-to-top.js"></script>
<script src="/js/invite-prefill.js"></script>
</body>
</html>
